                        <h1 class = "sub-title">Contact Me</h1>
                        <p><i class="fa-brands fa-google"></i> damian.aguilar.work@gmail.com</p>
                        <p><i class="fa-solid fa-phone-volume"></i> (903)-249-3337</p>
                        <div class="social-icons">

                    <div class="contact-right">
                        <form name="submit-to-google-sheet">
                            <input type="text" name="Name" placeholder="Your Name" required>
                            <input type="email" name="email" placeholder="Your Email" required>
                            <textarea name="Message" rows="6" placeholder="Your Message"></textarea>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxk_FPdm5ooPnYw0gAkRmSlFpJiGMIDWRaB4Vd28xT4RMHggmAuiPeXkzW8J1m3WvjYdQ/exec'
        const form = document.forms['submit-to-google-sheet']
        const msg = document.getElementById("msg")
  
        form.addEventListener('submit', e => {
        e.preventDefault()
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                msg.innerHTML = "Thank you for contacting!"
                setTimeout(function(){
                msg.innerHTML = ""
                }, 5000)
                form.reset()
            })
            .catch(error => console.error('Error!', error.message))
        })
    </script>
